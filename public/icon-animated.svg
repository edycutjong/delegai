<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/> <!-- Cyan -->
      <stop offset="100%" stop-color="#8B5CF6"/> <!-- Violet -->
    </linearGradient>
    <linearGradient id="grad-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse-spine {
        0%, 100% { opacity: 0.8; stroke-width: 22px; }
        50% { opacity: 1; stroke-width: 26px; }
      }
      @keyframes pulse-bowl {
        0%, 100% { opacity: 0.8; stroke-width: 22px; }
        50% { opacity: 1; stroke-width: 26px; }
      }
      @keyframes pulse-node-scale {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.2); opacity: 1; }
      }

      .animated-spine {
        animation: pulse-spine 3s infinite ease-in-out;
      }
      .animated-bowl {
        animation: pulse-bowl 3s infinite ease-in-out;
      }
      .animated-node-top {
        animation: pulse-node-scale 2.2s infinite ease-in-out;
        transform-origin: 160px 120px;
      }
      .animated-node-bottom {
        animation: pulse-node-scale 2.2s infinite ease-in-out 1.1s;
        transform-origin: 160px 392px;
      }
      .animated-node-middle {
        animation: pulse-node-scale 2.2s infinite ease-in-out 0.5s;
        transform-origin: 160px 256px;
      }
      .animated-node-right {
        animation: pulse-node-scale 2.2s infinite ease-in-out 1.6s;
        transform-origin: 355px 256px;
      }
      .animated-dot {
        animation: pulse-dot 1.5s infinite ease-in-out;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Plate -->
  <rect width="512" height="512" rx="128" fill="#080a0f" stroke="rgba(255, 255, 255, 0.04)" stroke-width="6"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(6, 182, 212, 0.03)" stroke-width="2" stroke-dasharray="10 8"/>

  <g filter="url(#glow)">
    <!-- The straight spine of the D -->
    <path d="M 160 120 L 160 392" stroke="url(#grad-vert)" stroke-width="24" stroke-linecap="round" class="animated-spine"/>
    
    <!-- The curved bowl of the D -->
    <path d="M 160 120 C 420 120, 420 392, 160 392" fill="none" stroke="url(#grad-line)" stroke-width="24" stroke-linecap="round" class="animated-bowl"/>

    <!-- Graph Nodes -->
    <circle cx="160" cy="120" r="32" fill="#06B6D4" class="animated-node-top"/>
    <circle cx="160" cy="392" r="32" fill="#8B5CF6" class="animated-node-bottom"/>
    <circle cx="160" cy="256" r="32" fill="#4989E5" class="animated-node-middle"/> 
    <circle cx="355" cy="256" r="32" fill="#6366F1" class="animated-node-right"/> 

    <!-- Inner tech dots -->
    <circle cx="160" cy="120" r="12" fill="#FFFFFF" class="animated-node-top"/>
    <circle cx="160" cy="392" r="12" fill="#FFFFFF" class="animated-node-bottom"/>
    <circle cx="160" cy="256" r="12" fill="#FFFFFF" class="animated-node-middle"/>
    <circle cx="355" cy="256" r="12" fill="#FFFFFF" class="animated-node-right"/>
  </g>
</svg>
